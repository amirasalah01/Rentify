<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Property Form - RentMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>.navbar-brand { font-weight: 700; font-size: 1.5rem; }</style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-house-heart-fill"></i> RentMe</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/auth/logout}" method="post" class="d-inline">
                        <button type="submit" class="nav-link btn btn-link text-white">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${property.id != null} ? 'Edit Property' : 'List New Property'">
                        Property Form
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="${formAction}" th:object="${property}" method="post" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Title *</label>
                                <input type="text" th:field="*{title}" class="form-control"
                                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{title}"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Address</label>
                                <input type="text" th:field="*{address}" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">City *</label>
                                <input type="text" th:field="*{city}" class="form-control"
                                       th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{city}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Country *</label>
                                <input type="text" th:field="*{country}" class="form-control"
                                       th:classappend="${#fields.hasErrors('country')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{country}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Property Type *</label>
                                <select th:field="*{propertyType}" class="form-select" required>
                                    <option value="">Select type</option>
                                    <option th:each="t : ${propertyTypes}"
                                            th:value="${t.name()}"
                                            th:text="${t.name()}">Type</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Bedrooms</label>
                                <input type="number" th:field="*{bedrooms}" class="form-control" min="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Bathrooms</label>
                                <input type="number" th:field="*{bathrooms}" class="form-control" min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Square Feet</label>
                                <input type="number" th:field="*{squareFeet}" class="form-control" min="0" step="1">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Price per Month ($) *</label>
                                <input type="number" th:field="*{pricePerMonth}" class="form-control"
                                       th:classappend="${#fields.hasErrors('pricePerMonth')} ? 'is-invalid'"
                                       min="0" step="0.01" required>
                                <div class="invalid-feedback" th:errors="*{pricePerMonth}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Available From</label>
                                <input type="date" th:field="*{availableFrom}" class="form-control">
                            </div>
                            <div class="col-md-6 d-flex align-items-end">
                                <div class="form-check mb-2">
                                    <input type="checkbox" th:field="*{available}"
                                           class="form-check-input" id="isAvailable">
                                    <label for="isAvailable" class="form-check-label">Available for Rent</label>
                                </div>
                            </div>
                            <div class="col-12 d-flex gap-2 justify-content-end">
                                <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i>
                                    <span th:text="${property.id != null} ? 'Update Property' : 'Create Property'">Save</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-light py-3 mt-auto">
    <div class="container text-center"><p class="mb-0">&copy; 2024 RentMe</p></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
