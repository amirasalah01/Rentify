<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inbox - RentMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>.navbar-brand { font-weight: 700; font-size: 1.5rem; }</style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-house-heart-fill"></i> RentMe</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/properties}">Properties</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/messages}">Messages</a></li>
                <li class="nav-item">
                    <form th:action="@{/auth/logout}" method="post" class="d-inline">
                        <button type="submit" class="nav-link btn btn-link text-white">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-inbox"></i> Inbox
            <span class="badge bg-danger" th:if="${unreadCount > 0}" th:text="${unreadCount}"></span>
        </h2>
        <a th:href="@{/messages/compose}" class="btn btn-primary">
            <i class="bi bi-pencil-square"></i> Compose
        </a>
    </div>

    <div class="alert alert-success alert-dismissible" th:if="${success}">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(messages)}">
        <i class="bi bi-info-circle"></i> Your inbox is empty.
    </div>

    <div class="list-group" th:unless="${#lists.isEmpty(messages)}">
        <a th:each="msg : ${messages}"
           th:href="@{/messages/{id}(id=${msg.id})}"
           class="list-group-item list-group-item-action"
           th:classappend="${!msg.read} ? ' list-group-item-primary fw-bold' : ''">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <i class="bi" th:classappend="${!msg.read} ? 'bi-envelope-fill text-primary' : 'bi-envelope-open'"></i>
                    <span class="ms-2" th:text="${msg.sender.username}">Sender</span>
                    <span class="text-muted ms-2">— </span>
                    <span th:text="${msg.subject}">Subject</span>
                </div>
                <small class="text-muted"
                       th:text="${#temporals.format(msg.createdAt, 'MMM dd, yyyy HH:mm')}">Date</small>
            </div>
            <div class="text-muted small mt-1" th:if="${msg.relatedProperty != null}">
                <i class="bi bi-building"></i>
                Re: <span th:text="${msg.relatedProperty.title}">Property</span>
            </div>
        </a>
    </div>
</div>

<footer class="bg-dark text-light py-3 mt-auto">
    <div class="container text-center"><p class="mb-0">&copy; 2024 RentMe</p></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
