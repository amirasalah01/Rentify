<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compose Message - RentMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>.navbar-brand { font-weight: 700; font-size: 1.5rem; }</style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-house-heart-fill"></i> RentMe</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/messages}">Inbox</a></li>
                <li class="nav-item">
                    <form th:action="@{/auth/logout}" method="post" class="d-inline">
                        <button type="submit" class="nav-link btn btn-link text-white">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Compose Message</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <form th:action="@{/messages/compose}" method="post">
                        <div class="mb-3">
                            <label for="recipientUsername" class="form-label">To (Username) *</label>
                            <input type="text" id="recipientUsername" name="recipientUsername"
                                   class="form-control" th:value="${recipientUsername}" required>
                        </div>
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject *</label>
                            <input type="text" id="subject" name="subject" class="form-control" required
                                   th:value="${relatedProperty != null} ? 'Enquiry: ' + ${relatedProperty.title} : ''">
                        </div>
                        <div class="mb-3">
                            <label for="body" class="form-label">Message *</label>
                            <textarea id="body" name="body" class="form-control" rows="6" required></textarea>
                        </div>
                        <div class="mb-3" th:if="${relatedProperty != null}">
                            <label class="form-label">Related Property</label>
                            <input type="text" class="form-control" readonly
                                   th:value="${relatedProperty.title + ' - ' + relatedProperty.city}">
                            <input type="hidden" name="relatedPropertyId" th:value="${relatedPropertyId}">
                        </div>
                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/messages}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send"></i> Send
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-light py-3 mt-auto">
    <div class="container text-center"><p class="mb-0">&copy; 2024 RentMe</p></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
