<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Message - RentMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>.navbar-brand { font-weight: 700; font-size: 1.5rem; }</style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-house-heart-fill"></i> RentMe</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/messages}">Inbox</a></li>
            <li class="nav-item">
                <form th:action="@{/auth/logout}" method="post" class="d-inline">
                    <button type="submit" class="nav-link btn btn-link text-white">Logout</button>
                </form>
            </li>
        </ul>
    </div>
</nav>

<div class="container my-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h5 class="mb-0" th:text="${message.subject}">Subject</h5>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-3">
                        <div>
                            <strong>From:</strong> <span th:text="${message.sender.username}">Sender</span>
                            <span class="mx-2">→</span>
                            <strong>To:</strong> <span th:text="${message.receiver.username}">Receiver</span>
                        </div>
                        <small class="text-muted"
                               th:text="${#temporals.format(message.createdAt, 'MMM dd, yyyy HH:mm')}">Date</small>
                    </div>
                    <div th:if="${message.relatedProperty != null}" class="alert alert-light mb-3">
                        <i class="bi bi-building"></i> Re:
                        <a th:href="@{/properties/{id}(id=${message.relatedProperty.id})}"
                           th:text="${message.relatedProperty.title}">Property</a>
                    </div>
                    <p class="card-text" style="white-space: pre-wrap" th:text="${message.body}">Body</p>
                </div>
                <div class="card-footer d-flex gap-2">
                    <a th:href="@{/messages/compose(recipientUsername=${message.sender.username})}"
                       class="btn btn-primary btn-sm">
                        <i class="bi bi-reply"></i> Reply
                    </a>
                    <a th:href="@{/messages}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left"></i> Back to Inbox
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-light py-3 mt-auto">
    <div class="container text-center"><p class="mb-0">&copy; 2024 RentMe</p></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
